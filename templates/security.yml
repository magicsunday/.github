name: Security

# Canonical `Security` caller for the repositories of this account, kept here
# outside `.github/workflows/` so that it never runs in this repository. Copy it
# to `.github/workflows/security.yml` of a repository and adapt only what is a
# real parameter of that repository:
#
#   - `with:` inputs of a job, such as `excludes` of `code-scanning` or `paths`
#     of `yamllint`.
#   - A guard such as `if: ${{ !github.event.repository.private }}` on every
#     scanner job of a private repository. With every job skipped the gate
#     still passes.
#   - The jobs themselves, which a repository may add to or drop.
#
# The job `all-security-checks` is the one status check that a branch
# protection requires. Its `needs` list must name every other job of this file,
# so add a job here and in that list in the same change. The gate runs whatever
# the other jobs did, passes when each of them succeeded or was skipped, and
# fails on a failure, a cancellation or any other result. Its name does not
# change with the event, which makes it usable as a required check for pull
# requests and pushes alike. `test-security-gate.sh` in this repository pins
# this behaviour.
on:
    push:
        branches: [main, master]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    code-scanning:
        uses: magicsunday/.github/.github/workflows/code-scanning.yml@main
        permissions:
            contents: read
            security-events: write

    zizmor:
        uses: magicsunday/.github/.github/workflows/zizmor.yml@main
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Publish only for the default branch, including manual workflow runs.
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: magicsunday/.github/.github/workflows/scorecard.yml@main
        permissions:
            contents: read
            security-events: write
            id-token: write

    dependency-review:
        # The dependency-review action only runs in a pull-request context.
        if: github.event_name == 'pull_request'
        uses: magicsunday/.github/.github/workflows/dependency-review.yml@main
        permissions:
            contents: read
            pull-requests: write

    yamllint:
        uses: magicsunday/.github/.github/workflows/yamllint.yml@main
        permissions:
            contents: read

    composer-audit:
        # The audit reads the advisory database of the day. On a pull request a
        # newly published advisory against an existing dependency would turn
        # every open pull request red without any change in it, and
        # dependency-review already covers what a pull request changes.
        if: github.event_name != 'pull_request'
        uses: magicsunday/.github/.github/workflows/composer-audit.yml@main
        permissions:
            contents: read

    all-security-checks:
        # One stable check name for the branch protection. It runs whatever the
        # other jobs did, passes when each of them succeeded or was skipped, and
        # fails on a failure, a cancellation or any other result. The needs
        # list must name every other job of this file.
        name: All security checks
        if: ${{ always() }}
        needs: [code-scanning, zizmor, scorecard, dependency-review, yamllint, composer-audit]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}

        steps:
            - name: Check the results of the security jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail
                  verdict=$(jq -rn --argjson needs "${NEEDS}" '
                      $needs
                      | if (type != "object") or (length == 0) then "no job results"
                      else
                          [to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"]
                          | join(" ")
                      end')
                  if [ -n "${verdict}" ]; then
                      echo "::error::Security jobs did not pass: ${verdict}"
                      exit 1
                  fi
                  echo 'Every security job succeeded or was skipped.'
