# Canonical magicsunday label set, the single source of truth.
# Applied to every actively-maintained (non-fork) repository. Repo-specific
# labels beyond this set are preserved; only these are enforced (name, color,
# description). Keep in sync via the reusable label-sync workflow.
#
# The AI issue labeler reads every label as `name: description` and chooses
# from that text, so a description is a decision criterion and not a caption.
# A description that opens with "Pull requests that" hides the label from the
# labeler, which is how the pull-request-only labels stay out of its choices.
# One that opens with "Set by maintainers" hides it too, for a decision or a
# workflow state that only a maintainer can establish after reading the issue.
- name: "bug"
  color: "d73a4a"
  description: "Reports a defect: the software behaves wrongly, crashes or contradicts its documentation"
- name: "enhancement"
  color: "a2eeef"
  description: "Asks for a new feature or an improvement to existing behaviour"
- name: "documentation"
  color: "0075ca"
  description: "Concerns documentation only: README, guides, comments or examples"
- name: "security"
  color: "ee0701"
  description: "Security-relevant finding"
- name: "question"
  color: "d876e3"
  description: "Asks how something works and reports no defect and requests no change"
- name: "duplicate"
  color: "cfd3d7"
  description: "Repeats an existing issue or pull request"
- name: "invalid"
  color: "e4e669"
  description: "Not a valid report: unrelated to this project or too thin to act on"
- name: "wontfix"
  color: "ffffff"
  description: "Set by maintainers: valid, but the maintainers decided not to act on it"
- name: "help wanted"
  color: "008672"
  description: "Set by maintainers: outside contributors are invited to take this on"
- name: "good first issue"
  color: "7057ff"
  description: "Set by maintainers: small, well-scoped task suited to a first-time contributor"
- name: "i18n"
  color: "c5def5"
  description: "Translations and internationalization"
- name: "upstream"
  color: "d4c5f9"
  description: "Caused by an upstream dependency such as webtrees core, not by this project"
- name: "not reproducible"
  color: "5319e7"
  description: "Set by maintainers: the reported behaviour could not be reproduced"
- name: "performance"
  color: "e4a11b"
  description: "Speed, memory use or rendering performance"
- name: "styling"
  color: "f9d0c4"
  description: "Visual appearance, CSS or layout"
- name: "awaiting feedback"
  color: "1d76db"
  description: "Set by maintainers: waiting for a response from the reporter or external information"
- name: "needs design"
  color: "8b5cf6"
  description: "Set by maintainers: needs a spec or brainstorm before implementation can start"
- name: "refactoring"
  color: "c2e0c6"
  description: "Restructuring or cleanup of code with no change in behaviour"
- name: "hardening"
  color: "5b6770"
  description: "Security or default-safety improvement without a known vulnerability"
- name: "needs-triage"
  color: "ededed"
  description: "Needs a first triage pass"
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, a security exploit, or a failure that stops all users or all dependent repositories"
- name: "priority: high"
  color: "d93f0b"
  description: "Breaks a major feature for a subset of users, or a confirmed security gap with no workaround"
- name: "priority: medium"
  color: "fbca04"
  description: "A real defect with a workaround, or a maintainability issue in active code"
- name: "priority: low"
  color: "0e8a16"
  description: "Cosmetic or documentation change, or a nice-to-have enhancement with no functional impact"
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "github_actions"
  color: "000000"
  description: "Pull requests that update GitHub Actions code"
- name: "python"
  color: "2b67c6"
  description: "Pull requests that update python code"
- name: "php"
  color: "45229e"
  description: "Pull requests that update php code"
- name: "javascript"
  color: "168700"
  description: "Pull requests that update javascript code"
