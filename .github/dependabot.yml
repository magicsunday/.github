version: 2

updates:
    # Version updates of this repository are proposed by Renovate. The limit of
    # zero silences the version updates of Dependabot and leaves its security
    # updates alone, while the entries stay because the canonical drift check
    # reads this file.
    -   package-ecosystem: github-actions
        directory: /
        open-pull-requests-limit: 0
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            github-actions:
                patterns:
                    - "*"

    # The pinned tool versions the reusable workflows install. This entry stays
    # for the canonical drift check only, and Renovate tracks the hash-locked
    # closures through its `pip-compile` manager. A bump of such a tool changes
    # the behaviour of a different gate in every repository of the account, so
    # a human merges each one.
    -   package-ecosystem: pip
        directory: /.github/requirements
        open-pull-requests-limit: 0
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
