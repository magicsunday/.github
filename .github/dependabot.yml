version: 2

updates:
    # Version updates of this repository are proposed by Renovate. The limit of
    # zero silences the version updates of Dependabot and leaves its security
    # updates alone, while the entries stay because the canonical drift check
    # reads this file.
    -   package-ecosystem: github-actions
        directory: /
        open-pull-requests-limit: 0
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
        groups:
            github-actions:
                patterns:
                    - "*"

    # The pinned tool versions the reusable workflows install. Kept ungrouped,
    # and excluded from auto-merge in `auto-merge-deps.yml`: each bump changes
    # the behaviour of a different gate in every repository of the account, so
    # they are held for a human one at a time.
    -   package-ecosystem: pip
        directory: /.github/requirements
        open-pull-requests-limit: 0
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        commit-message:
            prefix: "Update dependencies"
