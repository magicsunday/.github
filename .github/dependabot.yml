version: 2

updates:
    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
        groups:
            github-actions:
                patterns:
                    - "*"

    # The pinned tool versions the reusable workflows install. Kept ungrouped,
    # and excluded from auto-merge in `auto-merge-deps.yml`: each bump changes
    # the behaviour of a different gate in every repository of the account, so
    # they are held for a human one at a time.
    -   package-ecosystem: pip
        directory: /.github/requirements
        schedule:
            interval: weekly
        cooldown:
            default-days: 7
