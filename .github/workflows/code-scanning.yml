name: Code scanning (reusable)

# Reusable Semgrep scan shared across all magicsunday repositories. Callers
# invoke it via `uses: magicsunday/.github/.github/workflows/code-scanning.yml@main`
# and must grant `security-events: write`. The pinned engine version is read
# from this repository, so a caller's job needs to be able to read it — which
# holds because it is public. The job fails rather than uploading a report from
# a scan that did not run to completion; where a repository requires this
# context, that holds the merge until the scan runs again.
on:
    workflow_call:
        inputs:
            excludes:
                # A caller that legitimately keeps unscannable files — vendored
                # specification documents over the size limit, say — declares
                # them here rather than in a repository `.semgrepignore`: its own
                # file REPLACES Semgrep's built-in ignore list rather than adding
                # to it, which silently widens what gets scanned everywhere else
                # in that repository. Measured on one consumer, both runs on a
                # fresh clone: 474 scanned files became 724 once a
                # `.semgrepignore` holding a single directory was added.
                # Re-derive by diffing `jq '.paths.scanned | length'` across the
                # two runs.
                description: 'Whitespace-separated extra paths to exclude from the scan.'
                required: false
                type: string
                default: ''

permissions:
    contents: read

jobs:
    semgrep:
        name: Semgrep
        runs-on: ubuntu-latest

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            # The workspace holds the CALLER's checkout, so this repository's
            # pinned requirements are fetched separately, from the commit of this
            # workflow itself (see AGENTS.md). An undefined context property
            # would interpolate to an empty string and silently degrade to the
            # default branch, so both values are asserted before they are used.
            # The checkout path is claimed rather than assumed free: the install
            # step deletes it unconditionally, so a caller carrying a path of
            # that name would have it removed before the scan and the report
            # would omit it while still reading as complete. `-e` follows
            # symlinks and the deletion does not, so a dangling link of that
            # name is rejected explicitly rather than left to the narrower test.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }
                  { test ! -e .magicsunday-shared && test ! -L .magicsunday-shared; } || { echo "::error::This repository contains a path named '.magicsunday-shared', which the shared workflows reserve for their own checkout and delete again - rename it, or the scan would silently skip it."; exit 1; }

            - name: Check out the pinned requirements
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  persist-credentials: false

            # The shared checkout is removed once the install and the script
            # copy are done, so no finding can be reported against a file this
            # repository brought in. The library scripts the next step sources
            # are copied out to the runner's temp dir first, for the same
            # reason the reports below are written there rather than into the
            # workspace: this checkout, and the shell logic it carries,
            # belongs to this repository, not the caller's tree.
            - name: Install Semgrep
              env:
                  SCRIPT_LIB: ${{ runner.temp }}/semgrep-lib
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: --require-hashes -r .magicsunday-shared/.github/requirements/semgrep.txt
                  mkdir -p "$SCRIPT_LIB"
                  cp .magicsunday-shared/.github/scripts/lib/semgrep-excludes.sh "$SCRIPT_LIB/"
                  cp .magicsunday-shared/.github/scripts/lib/semgrep-report-check.sh "$SCRIPT_LIB/"
                  cp .magicsunday-shared/.github/scripts/lib/semgrepignore-guard.sh "$SCRIPT_LIB/"
                  cp .magicsunday-shared/.github/scripts/lib/annotation-sanitize.sh "$SCRIPT_LIB/"
                  cp .magicsunday-shared/.github/scripts/lib/retry.sh "$SCRIPT_LIB/"
                  rm -rf .magicsunday-shared

            # A repository-local `.semgrepignore` reaches the same outcome as
            # the `excludes` input above but REPLACES Semgrep's built-in
            # ignore list rather than adding to it, silently widening what
            # gets scanned everywhere else in that repository - and every
            # skip it causes carries the same `semgrepignore_patterns_match`
            # reason the engine's own defaults produce, so the report cannot
            # tell a caller's file apart from those defaults (issue #48).
            # Rejecting it here keeps exclusions visible in this run's log via
            # the `excludes` input instead of hidden in a file the report
            # cannot distinguish. Semgrepignore v2 (the pinned engine's
            # default) honors a `.semgrepignore` at ANY directory level, not
            # only the root, so a root-only check would leave the exact
            # channel this closes reachable one directory down - measured: a
            # `sub/.semgrepignore` naming `bad.php` drops `sub/bad.php` from
            # the scan with reason `semgrepignore_patterns_match`, identically
            # to a root-level file. `find_semgrepignore_files()`
            # (semgrepignore-guard.sh, sourced below) walks the whole
            # checkout instead of testing a single path; see that file for
            # why `.git`/`vendor`/`node_modules`/`.build` are pruned. This
            # step runs after `Install Semgrep` rather than right after
            # `Checkout`, because the function it sources only exists once
            # that step has copied it out of the shared checkout - trading a
            # slightly later failure for a guard `.github/scripts/tests/`
            # can actually exercise. Re-derive, in a git checkout:
            #
            #   mkdir -p sub && printf '<?php eval($_GET["x"]);\n' > sub/bad.php
            #   printf 'bad.php\n' > sub/.semgrepignore && git add -Af .
            #   semgrep scan --config p/php --json-output=j.json \
            #       --verbose --metrics off
            #   jq -r '.paths.skipped[] | "\(.path): \(.reason)"' j.json
            #       # sub/bad.php: semgrepignore_patterns_match
            - name: Check the repository does not carry a .semgrepignore file
              env:
                  SCRIPT_LIB: ${{ runner.temp }}/semgrep-lib
              run: |
                  set -euo pipefail
                  # shellcheck source=scripts/lib/semgrepignore-guard.sh
                  source "$SCRIPT_LIB/semgrepignore-guard.sh"
                  # assert_no_semgrepignore() (semgrepignore-guard.sh) carries
                  # the complete fail-closed assertion - including the
                  # find-failure fallback and the sanitize_for_annotation()
                  # call - so test-semgrepignore-guard.sh exercises the exact
                  # wiring this step relies on, not just its parts.
                  assert_no_semgrepignore

            # Multi-language security rule sets — CodeQL does not support PHP, so
            # Semgrep covers the PHP surface plus JavaScript and generic secret
            # patterns.
            #
            # Findings alone exit 0, so they inform rather than block without any
            # help from the step. A non-zero exit therefore means the scan hit an
            # error, and Semgrep writes its report before deciding that exit
            # code: unresolvable rule packs exit 7 with a well-formed report
            # holding zero results, a rule the pinned engine cannot parse exits
            # after a scan that did produce some. Either way the report covers
            # less than it claims to, and code scanning reads what a report omits
            # as fixed — so the job fails and the upload never runs, instead of
            # sending a partial picture. Where a repository requires this context
            # in branch protection, blocking the merge until the scan runs again
            # is precisely what requiring it asks for; everywhere else the
            # failure is visible without gating anything.
            #
            # An exit code of 0 does not mean the scan was complete, which is why
            # the report is also inspected below. A file Semgrep declines to
            # scan is recorded in its inventory and never reaches the exit code
            # — measured on the pin, `--strict` does not change that either, so
            # there is no flag that turns this into a failing run — and the
            # SARIF carries no inventory of what was scanned, so the omission
            # leaves no trace there at all. Re-derive:
            #
            #   printf '<?php\n' > huge.php
            #   yes '// pad' | head -200000 >> huge.php
            #   semgrep scan --config p/php --strict --sarif-output=s.sarif \
            #       --json-output=j.json --verbose --metrics off
            #   echo "exit $?"               # 0 — `--strict` does not fail it
            #   jq -c .paths.skipped j.json  # huge.php, exceeded_size_limit
            #   grep -c huge s.sarif         # 0 — the SARIF never mentions it
            #
            # `--strict` is in the recipe because it is the flag a reader will
            # reach for; without it the run cannot falsify the claim that none
            # exists.
            #
            # `--json-output` writes that inventory alongside the SARIF from the
            # same scan, and `--verbose` is what populates it — without the flag
            # `.paths.skipped` is `null` rather than a list.
            #
            # The report is written outside the workspace. Inside it, the run
            # would have to clear a stale file before the scan and remove a
            # rejected one after it — two deletions in a tree belonging to the
            # caller, one of them ahead of the scan that walks that tree. The
            # runner's temporary directory is per-job and starts empty, so there
            # is nothing to clear and nothing of the caller's to lose. The shared
            # checkout cannot take the same way out: `actions/checkout` rejects a
            # `path:` outside the workspace, which is why that one is guarded
            # instead.
            - name: Run Semgrep
              env:
                  SARIF_FILE: ${{ runner.temp }}/semgrep.sarif
                  JSON_FILE: ${{ runner.temp }}/semgrep.json
                  EXTRA_EXCLUDES: ${{ inputs.excludes }}
                  SCRIPT_LIB: ${{ runner.temp }}/semgrep-lib
              run: |
                  set -euo pipefail

                  # All three functions sourced below are the actual shipped
                  # text, not a copy of it: .github/scripts/tests/ sources the
                  # same files from this repository's own tree, so a test
                  # failure there means this step would fail identically.
                  # shellcheck source=scripts/lib/semgrep-excludes.sh
                  source "$SCRIPT_LIB/semgrep-excludes.sh"
                  # shellcheck source=scripts/lib/semgrep-report-check.sh
                  source "$SCRIPT_LIB/semgrep-report-check.sh"
                  # shellcheck source=scripts/lib/retry.sh
                  source "$SCRIPT_LIB/retry.sh"

                  # The caller's list is consumed from the environment rather
                  # than inlined into the command, so a value cannot inject
                  # shell; build_semgrep_exclude_args() keeps every pattern
                  # literal rather than letting the shell glob it against the
                  # runner's checkout — see semgrep-excludes.sh for the
                  # measured divergence this guards against.
                  extra=()
                  build_semgrep_exclude_args "${EXTRA_EXCLUDES:-}"

                  # Discarding stdout is not tidiness. Asking for the report by
                  # format flag re-enables the primary output, which as text
                  # echoes every finding WITH ITS MATCHED LINE — and `p/secrets`
                  # matches live credentials into a log that outlives the file
                  # they came from. `--quiet` is not an alternative: it is
                  # mutually exclusive with `--verbose` — undocumented in
                  # `--help`, only observable by running it. Re-derive:
                  #
                  #   semgrep scan --quiet --verbose --metrics off /dev/null
                  #   # [ERROR]: mutually exclusive options --quiet/--verbose/--debug
                  #
                  # `--json` is what keeps the diagnostics. Semgrep collapses
                  # onto a SINGLE stream when `GITHUB_ACTIONS` is set and the
                  # primary format is text, and that stream is stdout — so on a
                  # runner, and only there, the redirect below would swallow the
                  # skipped-file listing and every error explaining a non-zero
                  # exit. Naming a non-text primary format restores the split.
                  # A local run cannot show this; the variable has to be forced:
                  #
                  #   GITHUB_ACTIONS=true semgrep scan --config p/php --verbose \
                  #       --sarif-output=s.sarif --json-output=j.json \
                  #       --metrics off >out.txt 2>err.txt
                  #   wc -c < err.txt        # 0 without `--json`, non-zero with
                  #
                  # A transient outage while fetching the p/* rule packs from
                  # the Semgrep registry fails the run identically to a
                  # genuine scan error below — see issue #44 for why the
                  # packs cannot be pinned or vendored instead, which would
                  # remove this dependency on the registry's availability
                  # entirely. The two failure shapes are not distinguishable
                  # by exit code alone: measured on the pin, a
                  # renamed/removed rule pack (registry reachable) exits 7
                  # with a clean error and still writes both report files,
                  # while an unreachable registry exits 2 via an unhandled
                  # connection exception and writes neither. Retrying once
                  # unconditionally, rather than branching on the exit code,
                  # avoids relying on that undocumented and version-fragile
                  # distinction — a permanent failure such as the
                  # renamed-pack case simply fails the same way on the retry,
                  # at the cost of one extra scan. Re-derive:
                  #
                  #   HTTPS_PROXY=http://127.0.0.1:1 semgrep scan \
                  #       --config p/php --sarif-output=s.sarif \
                  #       --json-output=j.json --metrics off
                  #   echo "exit $?"; test -f s.sarif && echo has-sarif
                  #   # exit 2, no s.sarif — vs. exit 7 with both files
                  #   # present for `--config p/does-not-exist`
                  #
                  # attempt_semgrep_scan() removes both report files before
                  # every try, so a first attempt's report — well-formed even
                  # on the renamed-pack case — can never be the one the
                  # checks below end up inspecting; only the last attempt's
                  # outcome does, since run_with_retry returns that attempt's
                  # exit code and the checks below run against whatever that
                  # attempt left behind.
                  attempt_semgrep_scan() {
                      rm -f "$SARIF_FILE" "$JSON_FILE"
                      semgrep scan \
                          --config p/security-audit \
                          --config p/secrets \
                          --config p/php \
                          --config p/javascript \
                          --json \
                          --sarif-output="$SARIF_FILE" \
                          --json-output="$JSON_FILE" \
                          --verbose \
                          --exclude '*.min.js' \
                          --exclude vendor \
                          --exclude node_modules \
                          --exclude .build \
                          "${extra[@]}" \
                          --metrics off > /dev/null
                  }

                  rc=0
                  run_with_retry attempt_semgrep_scan || rc=$?

                  # Failing here is what discards the report: the upload step
                  # carries no condition, so it does not run once this one has
                  # failed.
                  if [ "$rc" -ne 0 ]; then
                      echo "::error::Semgrep exited ${rc} after ${RETRY_ATTEMPTS} attempt(s) - its report covers less than a complete scan, so nothing was uploaded and no alerts were touched."
                      exit "$rc"
                  fi

                  if [ ! -s "$SARIF_FILE" ] || [ ! -s "$JSON_FILE" ]; then
                      echo "::error::Semgrep exited 0 but did not write both reports - the scan step is misconfigured."
                      exit 1
                  fi

                  # assert_semgrep_report_complete() carries the readability
                  # check, the allowed-skip-reasons partition (including the
                  # `minified`/issue #50 and `Dotfile`/`Gitignore_patterns_match`/
                  # `Nonexistent_file`/issue #48 rationale and their re-derive
                  # commands), the scanned-file-count check, and the single-
                  # annotation sanitisation — see semgrep-report-check.sh.
                  assert_semgrep_report_complete "$JSON_FILE"

            - name: Upload SARIF to code scanning
              uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
              with:
                  sarif_file: ${{ runner.temp }}/semgrep.sarif
