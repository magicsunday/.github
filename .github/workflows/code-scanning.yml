name: Code scanning (reusable)

# Reusable Semgrep scan shared across all magicsunday repositories. Callers
# invoke it via `uses: magicsunday/.github/.github/workflows/code-scanning.yml@main`
# and must grant `security-events: write`. The pinned engine version is read
# from this repository, so a caller's job needs to be able to read it — which
# holds because it is public. The job fails rather than uploading a report from
# a scan that did not run to completion; where a repository requires this
# context, that holds the merge until the scan runs again.
on:
    workflow_call:
        inputs:
            excludes:
                # A caller that legitimately keeps unscannable files — vendored
                # specification documents over the size limit, say — declares
                # them here rather than in a repository `.semgrepignore`: its own
                # file REPLACES Semgrep's built-in ignore list rather than adding
                # to it, which silently widens what gets scanned everywhere else
                # in that repository. Measured on one consumer, both runs on a
                # fresh clone: 474 scanned files became 724 once a
                # `.semgrepignore` holding a single directory was added.
                # Re-derive by diffing `jq '.paths.scanned | length'` across the
                # two runs.
                description: 'Whitespace-separated extra paths to exclude from the scan.'
                required: false
                type: string
                default: ''

permissions:
    contents: read

jobs:
    semgrep:
        name: Semgrep
        runs-on: ubuntu-latest

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            # The workspace holds the CALLER's checkout, so this repository's
            # pinned requirements are fetched separately, from the commit of this
            # workflow itself (see AGENTS.md). An undefined context property
            # would interpolate to an empty string and silently degrade to the
            # default branch, so both values are asserted before they are used.
            # The checkout path is claimed rather than assumed free: the install
            # step deletes it unconditionally, so a caller carrying a path of
            # that name would have it removed before the scan and the report
            # would omit it while still reading as complete. `-e` follows
            # symlinks and the deletion does not, so a dangling link of that
            # name is rejected explicitly rather than left to the narrower test.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }
                  { test ! -e .magicsunday-shared && test ! -L .magicsunday-shared; } || { echo "::error::This repository contains a path named '.magicsunday-shared', which the shared workflows reserve for their own checkout and delete again - rename it, or the scan would silently skip it."; exit 1; }

            - name: Check out the pinned requirements
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  persist-credentials: false

            # The shared checkout is removed once the install is done, so no
            # finding can be reported against a file this repository brought in.
            - name: Install Semgrep
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: -r .magicsunday-shared/.github/requirements/semgrep.txt
                  rm -rf .magicsunday-shared

            # Multi-language security rule sets — CodeQL does not support PHP, so
            # Semgrep covers the PHP surface plus JavaScript and generic secret
            # patterns.
            #
            # Findings alone exit 0, so they inform rather than block without any
            # help from the step. A non-zero exit therefore means the scan hit an
            # error, and Semgrep writes its report before deciding that exit
            # code: unresolvable rule packs exit 7 with a well-formed report
            # holding zero results, a rule the pinned engine cannot parse exits
            # after a scan that did produce some. Either way the report covers
            # less than it claims to, and code scanning reads what a report omits
            # as fixed — so the job fails and the upload never runs, instead of
            # sending a partial picture. Where a repository requires this context
            # in branch protection, blocking the merge until the scan runs again
            # is precisely what requiring it asks for; everywhere else the
            # failure is visible without gating anything.
            #
            # An exit code of 0 does not mean the scan was complete, which is why
            # the report is also inspected below. A file Semgrep declines to
            # scan is recorded in its inventory and never reaches the exit code
            # — measured on the pin, `--strict` does not change that either, so
            # there is no flag that turns this into a failing run — and the
            # SARIF carries no inventory of what was scanned, so the omission
            # leaves no trace there at all. Re-derive:
            #
            #   printf '<?php\n' > huge.php
            #   yes '// pad' | head -200000 >> huge.php
            #   semgrep scan --config p/php --strict --sarif-output=s.sarif \
            #       --json-output=j.json --verbose --metrics off
            #   echo "exit $?"               # 0 — `--strict` does not fail it
            #   jq -c .paths.skipped j.json  # huge.php, exceeded_size_limit
            #   grep -c huge s.sarif         # 0 — the SARIF never mentions it
            #
            # `--strict` is in the recipe because it is the flag a reader will
            # reach for; without it the run cannot falsify the claim that none
            # exists.
            #
            # `--json-output` writes that inventory alongside the SARIF from the
            # same scan, and `--verbose` is what populates it — without the flag
            # `.paths.skipped` is `null` rather than a list.
            #
            # The report is written outside the workspace. Inside it, the run
            # would have to clear a stale file before the scan and remove a
            # rejected one after it — two deletions in a tree belonging to the
            # caller, one of them ahead of the scan that walks that tree. The
            # runner's temporary directory is per-job and starts empty, so there
            # is nothing to clear and nothing of the caller's to lose. The shared
            # checkout cannot take the same way out: `actions/checkout` rejects a
            # `path:` outside the workspace, which is why that one is guarded
            # instead.
            - name: Run Semgrep
              env:
                  SARIF_FILE: ${{ runner.temp }}/semgrep.sarif
                  JSON_FILE: ${{ runner.temp }}/semgrep.json
                  EXTRA_EXCLUDES: ${{ inputs.excludes }}
              run: |
                  set -euo pipefail

                  # The caller's list is consumed from the environment rather
                  # than inlined into the command, so a value cannot inject
                  # shell. It is split on spaces WITHOUT pathname expansion:
                  # an unquoted expansion would also glob, and glob is the
                  # wrong matcher here, because it resolves the pattern against
                  # the runner's checkout instead of handing it to Semgrep.
                  # The divergence is a SLASH-FREE pattern: measured on the
                  # pinned engine, `--exclude '*.pdf'` skips a PDF at any
                  # depth, while the shell expands it against the working
                  # directory only and leaves a nested one to be read — which
                  # then fails this gate and is reported as undeclared. A
                  # pattern WITH a slash is anchored one level either way, so
                  # it is the wrong example to reason from. Re-derive:
                  #
                  # Read `.paths.skipped`, not `.paths.scanned`: no language
                  # claims a PDF, so it is absent from BOTH inventories when
                  # unexcluded, and a scanned-side check would read as
                  # confirmation even if the pattern had stopped matching at
                  # depth.
                  #
                  #   semgrep scan --config p/php --exclude '*.pdf' \
                  #       --json-output=j.json --verbose --metrics off
                  #   jq -r '.paths.skipped[]
                  #       | select(.reason == "cli_exclude_flags_match")
                  #       | .path' j.json   # the nested PDF is listed too
                  #
                  # Globbing is switched off around the loop rather than the
                  # split being hand-rolled: the default `IFS` already splits
                  # on space, tab and newline, which is what a caller writing
                  # the YAML block form sends.
                  extra=()
                  set -f
                  # shellcheck disable=SC2086
                  for pattern in ${EXTRA_EXCLUDES:-}; do
                      extra+=(--exclude "$pattern")
                  done
                  set +f

                  # Discarding stdout is not tidiness. Asking for the report by
                  # format flag re-enables the primary output, which as text
                  # echoes every finding WITH ITS MATCHED LINE — and `p/secrets`
                  # matches live credentials into a log that outlives the file
                  # they came from. `--quiet` is not an alternative: it is
                  # mutually exclusive with `--verbose`.
                  #
                  # `--json` is what keeps the diagnostics. Semgrep collapses
                  # onto a SINGLE stream when `GITHUB_ACTIONS` is set and the
                  # primary format is text, and that stream is stdout — so on a
                  # runner, and only there, the redirect below would swallow the
                  # skipped-file listing and every error explaining a non-zero
                  # exit. Naming a non-text primary format restores the split.
                  # A local run cannot show this; the variable has to be forced:
                  #
                  #   GITHUB_ACTIONS=true semgrep scan --config p/php --verbose \
                  #       --sarif-output=s.sarif --json-output=j.json \
                  #       --metrics off >out.txt 2>err.txt
                  #   wc -c < err.txt        # 0 without `--json`, non-zero with
                  rc=0
                  semgrep scan \
                      --config p/security-audit \
                      --config p/secrets \
                      --config p/php \
                      --config p/javascript \
                      --json \
                      --sarif-output="$SARIF_FILE" \
                      --json-output="$JSON_FILE" \
                      --verbose \
                      --exclude '*.min.js' \
                      --exclude vendor \
                      --exclude node_modules \
                      --exclude .build \
                      "${extra[@]}" \
                      --metrics off > /dev/null || rc=$?

                  # Failing here is what discards the report: the upload step
                  # carries no condition, so it does not run once this one has
                  # failed.
                  if [ "$rc" -ne 0 ]; then
                      echo "::error::Semgrep exited ${rc} - its report covers less than a complete scan, so nothing was uploaded and no alerts were touched."
                      exit "$rc"
                  fi

                  if [ ! -s "$SARIF_FILE" ] || [ ! -s "$JSON_FILE" ]; then
                      echo "::error::Semgrep exited 0 but did not write both reports - the scan step is misconfigured."
                      exit 1
                  fi

                  # Readability is a property of the file, decided once here
                  # rather than at each of the reads below, so a malformed
                  # report fails with an explanation instead of a bare jq abort
                  # at whichever read reaches it first.
                  jq . "$JSON_FILE" > /dev/null || {
                      echo "::error::Semgrep's JSON report could not be read, so the scan could not be shown to be complete - nothing was uploaded."
                      exit 1
                  }

                  # Which skips are acceptable is decided by an allow list, so a
                  # reason this list does not name fails the job — including one
                  # a later engine introduces. A deny list naming today's known
                  # bad reasons would let exactly that next addition through
                  # silently, which is the defect this check exists to prevent.
                  #
                  # A reason is tolerated on one of two grounds: the file was
                  # never a scan target (this workflow's `--exclude` flags, an
                  # ignore file, a rule's own path rules), or its content cannot
                  # carry a finding any rule could make (`binary`).
                  #
                  # `minified` is neither, and is tolerated as an accepted risk.
                  # Minified JavaScript still parses, and `p/secrets` is regex
                  # work that minification does not defeat, so a token inlined
                  # by a build would sit in exactly such a file — and
                  # `bundle-freshness.yml` means consumers commit bundles by
                  # design, including ones the `*.min.js` exclude does not name.
                  # Denying it would red those consumers, which is a fleet
                  # policy change with its own review: issue #50.
                  #
                  # Everything else means a file that WAS a target went unread —
                  # it exceeded a limit, could not be parsed, or could not be
                  # opened — and its findings are missing from a report that
                  # does not say so. Re-derive the engine's full set; whatever
                  # it names that is absent below fails the job, so the two sets
                  # stay a partition by construction rather than by a count kept
                  # in step:
                  #
                  #   sed -n '/^class SkipReason/,/^class /p' "$(python3 -c \
                  #       'from semgrep.semgrep_interfaces import \
                  #        semgrep_output_v1 as m; print(m.__file__)')" \
                  #       | grep -oE "'[A-Za-z_]+'" | grep -vx "'SkipReason'" \
                  #       | sort -u
                  #
                  # The character class has to admit capitals, or it drops the
                  # three PascalCase wire values and its output then agrees with
                  # this list and reads as complete. It also has to drop the
                  # class's own name, which the generated file repeats inside
                  # the same block.
                  #
                  # Those three — `Dotfile`, `Gitignore_patterns_match`,
                  # `Nonexistent_file` — are denied, but measured on the pin the
                  # scan path never emits them: a dotfile directory is scanned,
                  # and a gitignored path is reported as
                  # `semgrepignore_patterns_match`, which this list tolerates.
                  # So denying them is a decision about the schema, not live
                  # coverage — a `.gitignore` DIRECTORY entry covering tracked
                  # files does drop them silently, and that is the accepted risk
                  # recorded in issue #48 rather than something denied here.
                  # Re-derive, in a git checkout, since targets come from
                  # `git ls-files` when one is present:
                  #
                  #   mkdir -p dist .hidden
                  #   printf '<?php eval($_GET["x"]);\n' > dist/x.php
                  #   printf '<?php eval($_GET["y"]);\n' > .hidden/y.php
                  #   printf 'dist/\n' > .gitignore && git add -Af . &&
                  #   semgrep scan --config p/php --json-output=j.json \
                  #       --verbose --metrics off
                  #   jq -r '.paths.skipped[] | "\(.path): \(.reason)"' j.json
                  #       # dist/x.php: semgrepignore_patterns_match — tracked,
                  #       # holding a finding, dropped, and tolerated here
                  #   jq -r '.paths.scanned[]' j.json
                  #       # .hidden/y.php — the dotfile directory was scanned
                  #
                  # Both fixtures have to exist, or the commands print nothing
                  # and the empty output reads as confirmation.
                  ALLOWED_SKIP_REASONS='[
                      "always_skipped",
                      "binary",
                      "cli_exclude_flags_match",
                      "cli_include_flags_do_not_match",
                      "excluded_by_config",
                      "irrelevant_rule",
                      "minified",
                      "semgrepignore_patterns_match",
                      "wrong_language"
                  ]'

                  # A missing inventory is treated as a finding rather than as an
                  # empty one, so dropping `--verbose` cannot quietly pass.
                  #
                  # Paths are sanitised because the result is folded into a
                  # workflow command below, where `%0A` is the newline it uses
                  # to carry more than one line. A path holding a literal `%`
                  # would otherwise be read as that markup, and git permits a
                  # raw newline in a path, which would end the annotation early
                  # and leave the rest as an unattributed log line.
                  unexpected="$(jq -r --argjson allowed "$ALLOWED_SKIP_REASONS" '
                      if (.paths.skipped | type) != "array" then
                          ["(whole report): no-skipped-inventory"]
                      else
                          [.paths.skipped[]
                              | (.reason // "unknown") as $reason
                              | select(($allowed | index($reason)) == null)
                              | ((.path // "(no path)")
                                  | gsub("%"; "%25")
                                  | gsub("[[:cntrl:]]"; "?")) as $path
                              | "\($path): \($reason)"]
                      end
                      | join("%0A")
                  ' "$JSON_FILE")"

                  # The offenders are folded into the annotation itself: a plain
                  # log line does not reach the checks pane, so a message
                  # promising a list would arrive without one.
                  if [ -n "$unexpected" ]; then
                      echo "::error::Semgrep exited 0 but did not scan every file it was given, so its report understates what is in the tree and code scanning would retire the alerts of the files below. If a file is not meant to be scanned, declare it through this workflow's 'excludes' input in the caller; otherwise fix what stopped it being read. A pattern holding a slash is anchored at the root and its '*' does not cross one, so a nested file needs its directory, its literal path, or a '**' pattern.%0A${unexpected}"
                      exit 1
                  fi

                  # A report over an empty file set is well-formed and asserts
                  # that nothing is wrong, which would retire every alert at
                  # once. An absent inventory counts as empty here: jq gives
                  # `null | length` as 0, and the check above has already
                  # rejected the reports where the inventory is missing.
                  scanned="$(jq '.paths.scanned | length' "$JSON_FILE")"

                  if [ "$scanned" -lt 1 ]; then
                      echo "::error::Semgrep scanned no files at all, so its report asserts a clean tree it never looked at."
                      exit 1
                  fi

                  # A tolerated skip is still a file whose alerts this upload
                  # retires, so what was skipped has to be legible in the run
                  # that did it — but the engine already writes that: `--verbose`
                  # puts a `Files skipped:` section naming each path, and a
                  # `Scan skipped:` breakdown per reason, on stderr, which is
                  # kept. Reprinting it from the JSON gave counts without the
                  # paths, so only the gate's own verdict is echoed here.
                  echo "Scanned ${scanned} files, no undeclared skips."

            - name: Upload SARIF to code scanning
              uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
              with:
                  sarif_file: ${{ runner.temp }}/semgrep.sarif
