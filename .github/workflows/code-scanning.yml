name: Code scanning (reusable)

# Reusable Semgrep scan shared across all magicsunday repositories. Callers
# invoke it via `uses: magicsunday/.github/.github/workflows/code-scanning.yml@main`
# and must grant `security-events: write`. The pinned engine version is read
# from this repository, so a caller's job needs to be able to read it — which
# holds because it is public. The job fails rather than uploading a report from
# a scan that did not run to completion; where a repository requires this
# context, that holds the merge until the scan runs again.
on:
    workflow_call:

permissions:
    contents: read

jobs:
    semgrep:
        name: Semgrep
        runs-on: ubuntu-latest

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: '3.12'

            # The workspace holds the CALLER's checkout, so this repository's
            # pinned requirements are fetched separately, from the commit of this
            # workflow itself (see AGENTS.md). An undefined context property
            # would interpolate to an empty string and silently degrade to the
            # default branch, so both values are asserted before they are used.
            # The checkout path is claimed rather than assumed free: the install
            # step deletes it unconditionally, so a caller carrying a path of
            # that name would have it removed before the scan and the report
            # would omit it while still reading as complete.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }
                  test ! -e .magicsunday-shared || { echo "::error::This repository contains a path named '.magicsunday-shared', which the shared workflows reserve for their own checkout and delete again - rename it, or the scan would silently skip it."; exit 1; }

            - name: Check out the pinned requirements
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  persist-credentials: false

            # The shared checkout is removed once the install is done, so no
            # finding can be reported against a file this repository brought in.
            - name: Install Semgrep
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: -r .magicsunday-shared/.github/requirements/semgrep.txt
                  rm -rf .magicsunday-shared

            # Multi-language security rule sets — CodeQL does not support PHP, so
            # Semgrep covers the PHP surface plus JavaScript and generic secret
            # patterns.
            #
            # Findings alone exit 0, so they inform rather than block without any
            # help from the step. A non-zero exit therefore means the scan hit an
            # error, and Semgrep writes its report before deciding that exit
            # code: unresolvable rule packs exit 7 with a well-formed report
            # holding zero results, a rule the pinned engine cannot parse exits
            # after a scan that did produce some. Either way the report covers
            # less than it claims to, and code scanning reads what a report omits
            # as fixed — so it is dropped and the job fails instead of uploading
            # a partial picture. Where a repository requires this context in
            # branch protection, blocking the merge until the scan runs again is
            # precisely what requiring it asks for; everywhere else the failure is
            # visible without gating anything.
            - name: Run Semgrep
              run: |
                  set -euo pipefail

                  # Only a report this run wrote may be uploaded, so anything
                  # already sitting in the caller's workspace goes first.
                  rm -f semgrep.sarif

                  rc=0
                  semgrep scan \
                      --config p/security-audit \
                      --config p/secrets \
                      --config p/php \
                      --config p/javascript \
                      --sarif --output semgrep.sarif \
                      --exclude '*.min.js' \
                      --exclude vendor \
                      --exclude node_modules \
                      --exclude .build \
                      --metrics off || rc=$?

                  # The annotation comes first: `run:` blocks execute under
                  # `bash -e`, which `set -uo pipefail` does not turn off, so a
                  # command placed ahead of the message would take it and the
                  # exit code down with it.
                  if [ "$rc" -ne 0 ]; then
                      echo "::error::Semgrep exited ${rc} - its report covers less than a complete scan, so it was discarded and no alerts were uploaded."
                      rm -f semgrep.sarif || true
                      exit "$rc"
                  fi

                  if [ ! -s semgrep.sarif ]; then
                      echo "::error::Semgrep exited 0 but wrote no report - the scan step is misconfigured."
                      exit 1
                  fi

            - name: Upload SARIF to code scanning
              uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
              with:
                  sarif_file: semgrep.sarif
