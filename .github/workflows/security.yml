name: Security

# Dogfood the reusable security scanners against this repository's own workflow
# YAML, dependency manifests and supply-chain posture so a template regression
# is caught here before it ships to consumers. The scanners are invoked through
# the self-repository form `$/` rather than the published
# `magicsunday/.github/...@main` ref that downstream repositories use.
on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '27 3 * * 1'

permissions:
    contents: read

jobs:
    zizmor:
        uses: $/.github/workflows/zizmor.yml
        permissions:
            contents: read
            security-events: write

    scorecard:
        # Scorecard publishes against the default branch; skip pull-request runs.
        if: github.event_name != 'pull_request'
        uses: $/.github/workflows/scorecard.yml
        permissions:
            contents: read
            security-events: write
            id-token: write

    code-scanning:
        uses: $/.github/workflows/code-scanning.yml
        permissions:
            contents: read
            security-events: write

    dependency-review:
        # The action only operates on a pull request's diff.
        if: github.event_name == 'pull_request'
        uses: $/.github/workflows/dependency-review.yml
        permissions:
            contents: read
            pull-requests: write

    all-security-checks:
        # One stable check name for the branch protection. It runs whatever the
        # other jobs did, passes when each of them succeeded or was skipped, and
        # fails on a failure, a cancellation or any other result. The needs
        # list must name every other job of this file.
        name: All security checks
        if: ${{ always() }}
        needs: [zizmor, scorecard, code-scanning, dependency-review]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}

        steps:
            - name: Check the results of the security jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail
                  verdict=$(jq -rn --argjson needs "${NEEDS}" '
                      $needs
                      | if (type != "object") or (length == 0) then "no job results"
                      else
                          [to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"]
                          | join(" ")
                      end')
                  if [ -n "${verdict}" ]; then
                      echo "::error::Security jobs did not pass: ${verdict}"
                      exit 1
                  fi
                  echo 'Every security job succeeded or was skipped.'
