name: Scorecard (reusable)

# Reusable OSSF Scorecard supply-chain analysis shared across all magicsunday
# repositories. Callers invoke it via
# `uses: magicsunday/.github/.github/workflows/scorecard.yml@main` and must grant
# `security-events: write` and `id-token: write`. Only meaningful on public repos.
on:
    workflow_call:

permissions:
    contents: read

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest

        permissions:
            # Upload the results to the code-scanning dashboard.
            security-events: write
            # Publish the results to the public OpenSSF dashboard.
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run OSSF Scorecard
              uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
              with:
                  results_file: scorecard.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload SARIF to code scanning
              if: always()
              uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
              with:
                  sarif_file: scorecard.sarif
