name: Scorecard (reusable)

# Reusable OSSF Scorecard supply-chain analysis shared across all magicsunday
# repositories. Callers invoke it via
# `uses: magicsunday/.github/.github/workflows/scorecard.yml@main` and must grant
# `security-events: write` and `id-token: write`. Only meaningful on public repos.
on:
    workflow_call:

permissions:
    contents: read

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest

        permissions:
            # Upload the results to the code-scanning dashboard.
            security-events: write
            # Publish the results to the public OpenSSF dashboard.
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run OSSF Scorecard
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: scorecard.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload SARIF to code scanning
              if: always()
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: scorecard.sarif
