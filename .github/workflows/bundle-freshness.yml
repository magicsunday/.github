name: Bundle freshness (reusable)

# Reusable JavaScript-bundle freshness check for repositories that ship a
# committed Rollup bundle (resources/js/*.min.js) built from source plus a
# pinned @magicsunday/webtrees-chart-lib dependency.
#
# Why this exists: a bump of a dependency bot, a hand edit of the chart-lib pin, or
# any source change — updates package.json and the lockfile but NEVER rebuilds
# the committed bundle. The shipped *.min.js therefore silently lags the
# resolved dependency: the manifest claims chart-lib X, the bundle still embeds
# chart-lib Y. This gate rebuilds the bundle inside the SAME container image the
# maintainer's local `make build` uses, then fails on any non-empty diff —
# turning a stale artefact into a hard CI failure for every pull request
# (a bot and a human alike). It is the bundle analogue of the i18n
# "Pipeline freshness" check.
#
# Determinism: the rebuild runs in the caller's `node-image` (default
# `ghcr.io/magicsunday/webtrees-docker-module-base:node24`, the webtrees-docker tooling image) — pinned to the SAME exact
# Node major the compose `node` service, the buildbox and `make build` use — so terser's mangled output is
# byte-identical to the committed bundle. A different Node major remangles and
# trips a phantom diff, so the image is pinned to an EXACT major; a floating
# `lts`/`latest` tag must NOT be used (an LTS major rollover would re-mangle
# every committed bundle at once).
#
# Callers invoke this via
# `uses: magicsunday/.github/.github/workflows/bundle-freshness.yml@main`
# and may override `bundle-dir` if their committed bundle lives elsewhere.
#
# Optional push of the rebuilt bundle. A caller that passes the secret
# `push_token`, a token with write access to the contents of its repository,
# gets the rebuilt bundle committed to the branch of a pull request of the bot
# (`bot-login`), so the next run passes without a person. The check itself
# stays a failure on the commit that lags. The token must not be the token of
# the workflow run, because a push with that one starts no new checks. Without
# `push_token` nothing is pushed and the check only fails. Only the push job
# references the secret. A job that references a secret has it loaded into
# its runner, and the build job runs package scripts, so the build job must
# not name it.
on:
    workflow_call:
        inputs:
            bundle-dir:
                description: 'Directory whose committed bundle artefacts must match a clean rebuild.'
                type: string
                default: 'resources/js'
            node-image:
                description: 'Container image whose Node/Rollup/terser must match the maintainer''s local `make build`.'
                type: string
                default: 'ghcr.io/magicsunday/webtrees-docker-module-base:node24@sha256:39fc8641796056a05d6dd5112b181706bad299282b163147e20d4c3b9cce9da7'
            bot-login:
                description: 'Login of the pull request author whose pull requests get the rebuilt bundle pushed.'
                type: string
                default: 'renovate[bot]'
        secrets:
            push_token:
                description: 'Token with write access to the contents of the calling repository, for example a fine-grained personal access token limited to that repository. Empty switches the push off, and the check only fails.'
                required: false

permissions:
    contents: read

jobs:
    bundle-freshness:
        name: Bundle freshness
        runs-on: ubuntu-latest

        permissions:
            contents: read

        outputs:
            patchable: ${{ steps.rebuild.outputs.patchable }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Rebuild the bundle and assert it is up to date
              id: rebuild
              timeout-minutes: 15
              env:
                  BUNDLE_DIR: ${{ inputs.bundle-dir }}
                  NODE_IMAGE: ${{ inputs.node-image }}
                  # Only a pull request of the configured bot in this repository
                  # gets its rebuilt bundle pushed, never a fork or a human.
                  AUTO_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == inputs.bot-login && github.event.pull_request.head.repo.full_name == github.repository }}
              run: |
                  set -euo pipefail

                  # Build inside the same image the maintainer's `make build`
                  # uses (compose `node` service = the tooling image) so terser's
                  # output is byte-identical to the committed bundle. `npm ci`
                  # needs git to fetch the `github:`-pinned chart-lib
                  # dependency; the container has no SSH key, so the insteadOf
                  # rewrite resolves the lockfile's git+ssh URL over anonymous
                  # HTTPS (chart-lib is a public repo). `npm run prepare` is the
                  # repo's Rollup build — the same recipe as `make build`.
                  # The steps live in one variable, because the failure message
                  # below prints them as the command that fixes the failure. The
                  # script must stay free of single quotes. The printed command
                  # wraps it in them. Both insteadOf rewrites use one config key,
                  # so the second call adds a value. A plain call would replace
                  # the first rewrite.
                  BUILD_SCRIPT=$(cat <<'BUILD_SCRIPT_END'
                  set -e
                  apk add --no-cache git >/dev/null
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
                  npm ci
                  npm run prepare
                  BUILD_SCRIPT_END
                  )
                  docker run --rm -v "$PWD":/app -w /app "$NODE_IMAGE" sh -c "$BUILD_SCRIPT"

                  # Stage everything so a NEW untracked bundle file is caught
                  # too — `git diff` alone ignores untracked files. node_modules
                  # is gitignored and stays out.
                  git add -A
                  if git diff --cached --quiet; then
                      echo "Bundle freshness check passed: the committed bundle matches a clean rebuild." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  # Hand the change to the push job as a patch, but only when it
                  # stays inside the bundle directory. A rebuild that touches
                  # anything else is never pushed, a person looks at it.
                  if [ "$AUTO_PUSH" = "true" ]; then
                      outside=$(git diff --cached --name-only -- ":(exclude)${BUNDLE_DIR}")
                      if [ -z "$outside" ]; then
                          git diff --cached --binary --no-renames -- "$BUNDLE_DIR" > "$RUNNER_TEMP/bundle.patch"
                          echo "patchable=true" >> "$GITHUB_OUTPUT"
                      fi
                  fi

                  echo "::error::The committed JavaScript bundle is out of date. The job summary names the command that rebuilds it. Commit the files that the rebuild changes."
                  {
                      echo "## Bundle freshness"
                      echo
                      echo "Rebuilding changed the tree. The committed \`${BUNDLE_DIR}\` bundle lags the resolved dependencies (typically a dependency update not followed by a rebuild)."
                      echo
                      echo '### Rebuild'
                      echo
                      echo "Run this in a checkout of the pull request branch, then commit the files it changed. It needs Docker and no other tooling, and it is the same build as this job. The container runs as root, so the files it writes belong to root in your checkout. A dependency bot that rebases the branch afterwards may drop the commit, so run it after the last rebase."
                      echo
                      echo '```'
                      echo "docker run --rm -v \"\$PWD\":/app -w /app ${NODE_IMAGE} sh -c '${BUILD_SCRIPT}'"
                      echo '```'
                      echo
                      echo '### Changes'
                      echo '```'
                      git diff --cached --stat
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  git --no-pager diff --cached -- "$BUNDLE_DIR"
                  exit 1

            - name: Keep the patch for the push job
              if: ${{ failure() && steps.rebuild.outputs.patchable == 'true' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: bundle-patch
                  path: ${{ runner.temp }}/bundle.patch
                  if-no-files-found: error
                  retention-days: 1
                  overwrite: true

    # Pushes the rebuilt bundle to the branch of a bot pull request. The build
    # above installs packages and runs their lifecycle scripts, so it does not
    # name the secret, and what it hands over is untrusted. This job holds
    # the token and applies the patch only after it checked that the branch
    # still is the head commit the run started on and that the patch changes
    # regular files inside the bundle directory and nothing else. The patch is
    # made on the merge of the pull request, so it fails to apply when the base
    # branch changed the bundle meanwhile, and the next run after a rebase
    # does the rebuild.
    push-rebuild:
        name: Push the rebuilt bundle
        needs: bundle-freshness
        # The build job runs package scripts and can set its own output, so
        # the gate of the build step is repeated here with values that come
        # from the event and not from the build. The needed job fails on
        # purpose whenever the bundle lags, which is when a patch exists, so
        # the default success condition would skip this job exactly then and
        # the not-cancelled condition lets it run after that failure.
        if: ${{ !cancelled() && needs.bundle-freshness.outputs.patchable == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == inputs.bot-login && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest

        permissions: {}

        # A newer push to the branch makes the older run obsolete, and the
        # newer commit starts its own run, so cancelling the older one is safe.
        concurrency:
            group: bundle-rebuild-${{ github.event.pull_request.number }}
            cancel-in-progress: true

        steps:
            # Without a token the job ends here and nothing is pushed. The
            # check lives in this job because only this job may name the secret.
            - name: Check that a push token is present
              id: token
              env:
                  TOKEN: ${{ secrets.push_token }}
              run: |
                  if [ -n "$TOKEN" ]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::No push token was passed, so the rebuilt bundle is not pushed."
                  fi

            - name: Download the patch
              if: ${{ steps.token.outputs.present == 'true' }}
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: bundle-patch
                  path: ${{ runner.temp }}/bundle-patch

            - name: Checkout the pull request head
              if: ${{ steps.token.outputs.present == 'true' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  token: ${{ secrets.push_token }}
                  persist-credentials: false

            - name: Commit the rebuilt bundle and push it
              if: ${{ steps.token.outputs.present == 'true' }}
              env:
                  TOKEN: ${{ secrets.push_token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  REPOSITORY: ${{ github.repository }}
                  BUNDLE_DIR: ${{ inputs.bundle-dir }}
                  PATCH_DIR: ${{ runner.temp }}/bundle-patch
              run: |
                  set -euo pipefail

                  remote="https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"

                  # A newer push to the branch starts its own run, which then
                  # does the rebuild for that commit.
                  current=$(git ls-remote "$remote" "refs/heads/${HEAD_REF}" | cut -f1)
                  if [ "$current" != "$HEAD_SHA" ]; then
                      echo "::notice::The branch moved on after this check started, so the rebuild is left to the run of the newer commit."
                      exit 0
                  fi

                  # A rebuild that never converges would push again for every
                  # run, so the push stops when the head commit already is the
                  # rebuild commit of this job.
                  head_author=$(git log -1 --format=%ae)
                  head_subject=$(git log -1 --format=%s)
                  if [ "$head_author" = "41898282+github-actions[bot]@users.noreply.github.com" ] && [ "$head_subject" = "Rebuild the bundle after the dependency update" ]; then
                      echo "::error::The head commit already is the rebuild of the bundle and the bundle still lags, so the rebuild does not converge and is not pushed again."
                      exit 1
                  fi

                  # The build ran package scripts, so the patch is not trusted.
                  # It is applied to the index first and the result is checked,
                  # not the text of the patch. Every entry must end as a regular
                  # file below the bundle directory or as a deletion, which also
                  # covers a rename, a symlink and a submodule, in every
                  # spelling the patch format allows.
                  git apply --index "${PATCH_DIR}/bundle.patch"
                  unexpected=$(git diff --cached --raw --no-renames -z | tr '\0' '\n' | awk -v dir="${BUNDLE_DIR%/}/" '
                      NR % 2 == 1 {
                          if ($2 !~ /^(000000|100644|100755)$/) {
                              print "mode " $2
                          }
                          next
                      }
                      substr($0, 1, length(dir)) != dir { print "path " $0 }
                  ')
                  if [ -n "$unexpected" ]; then
                      echo "::error::The rebuilt patch changes something other than regular files inside the bundle directory, so it is not pushed."
                      exit 1
                  fi

                  # The commit is made as the bot user of GitHub Actions, with
                  # the sign-off of that identity.
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git commit --signoff -m "Rebuild the bundle after the dependency update"
                  git push "$remote" "HEAD:refs/heads/${HEAD_REF}"
