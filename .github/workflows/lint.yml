name: Lint

# Dogfood the reusable yamllint check against this repository's own
# workflow YAML so the shared templates cannot regress the house style, and
# run the shell-logic tests that pin the `run:` blocks the reusable workflows
# source from .github/scripts/lib/.
on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    yamllint:
        uses: ./.github/workflows/yamllint.yml
        permissions:
            contents: read

    pip-closures-fresh:
        name: Verify hash-locked pip closures are current
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            # See AGENTS.md, "hash-locked closure", for why pip-compile
            # without --upgrade only reports genuine .in drift here, rather
            # than also firing on unrelated upstream releases of transitive
            # dependencies. `git add` before the cached diff is load-bearing,
            # not decoration: a plain `git diff` is silent on an untracked
            # path, so a new .in whose .txt was never committed would
            # otherwise false-green instead of failing.
            - name: Regenerate each closure and diff against the committed copy
              working-directory: .github/requirements
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: --require-hashes -r pip-tools.txt

                  failed=0
                  for txt_file in *.txt; do
                      name="${txt_file%.txt}"
                      if [ ! -f "${name}.in" ]; then
                          echo "::error::${txt_file} has no matching ${name}.in - remove the orphaned closure or restore its source."
                          failed=1
                      fi
                  done

                  for in_file in *.in; do
                      name="${in_file%.in}"
                      pip-compile --allow-unsafe --generate-hashes --output-file="${name}.txt" "${in_file}"
                      git add -- "${name}.txt"
                      if ! git diff --cached -u --exit-code -- "${name}.txt"; then
                          echo "::error::${name}.txt is not current with ${in_file} - regenerate it (see AGENTS.md, 'hash-locked closure')."
                          failed=1
                      fi
                  done

                  exit "${failed}"

    semgrep-smoke:
        name: Run the pinned Semgrep engine against a bundle-like fixture
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            # test-semgrep-report-check.sh exercises assert_semgrep_report_complete()
            # against hand-written JSON fixtures - it pins the gate's own logic, but
            # never runs the actual pinned engine, so an engine bump that changed what
            # a real scan's skip inventory looks like would pass that suite unnoticed.
            # This step runs the pinned engine itself against a fixture built to
            # cross its own minified-file thresholds (see the re-derive recipe in
            # semgrep-report-check.sh's assert_semgrep_report_complete() for the
            # exact wording and command), reproducing that file's own re-derive
            # recipe for the claim that `minified` cannot occur through this
            # workflow's invocation (issue #50). The rule config is a trivial local
            # pattern rather than a `p/*` registry pack: those packs are live,
            # unpinned and fetched from the Semgrep registry (AGENTS.md, "cannot be
            # pinned or vendored"), which is exactly the flakiness a required check
            # should not carry - a registry-backed assertion belongs in an optional,
            # non-blocking step instead (issue #67).
            - name: Install the pinned engine and scan a bundle-like fixture
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: --require-hashes -r .github/requirements/semgrep.txt

                  # shellcheck source=scripts/lib/semgrep-report-check.sh
                  source .github/scripts/lib/semgrep-report-check.sh
                  build_minified_fixture bundle.js

                  cat > smoke-rule.yml <<'RULE'
                  rules:
                      - id: smoke-test-noop
                        languages: [javascript]
                        message: noop rule for the smoke test - only the skip inventory below is asserted
                        severity: INFO
                        pattern: $FUNC(...)
                  RULE

                  semgrep scan --config smoke-rule.yml --json-output=smoke.json --verbose --metrics off bundle.js

                  scanned="$(jq -c '.paths.scanned' smoke.json)"
                  if [ "$scanned" != '["bundle.js"]' ]; then
                      echo "::error::The pinned engine did not report bundle.js as scanned - this smoke check verified nothing: ${scanned}"
                      exit 1
                  fi

                  skipped="$(jq -c '.paths.skipped' smoke.json)"
                  if [ "$skipped" != "[]" ]; then
                      echo "::error::The pinned engine skipped the bundle-like fixture - 'minified' may be reachable again, which semgrep-report-check.sh omits on the ground it is not: ${skipped}"
                      exit 1
                  fi

                  echo "Pinned engine scanned the bundle-like fixture with no skips."

            # semgrep-report-check.sh's assert_semgrep_report_complete()
            # repo_root branch (issue #49) rests on one further pinned-engine
            # claim: a git-tracked symlink or gitlink is reported in NEITHER
            # .paths.scanned NOR .paths.skipped. Like the minified-fixture
            # claim above, that fact is otherwise pinned only by hand-written
            # JSON fixtures in test-semgrep-report-check.sh, never by a real
            # scan - this step re-derives it against the pinned engine
            # itself, mirroring semgrep-report-check.sh's own dated repro
            # comments for this claim, so a future engine bump that starts
            # listing either object type fails here instead of silently
            # widening the completeness gate's blind spot.
            - name: Scan a git-tracked symlink and gitlink
              run: |
                  set -euo pipefail
                  mkdir smoke-repo && cd smoke-repo
                  git init --quiet
                  printf 'function f(a,b,c){return a+b+c;}\n' > target.js
                  ln -s target.js link.js
                  git update-index --add --cacheinfo 160000,4b825dc642cb6eb9a060e54bf8d69288fbee4904,vendored-dir
                  git add -- target.js link.js

                  semgrep scan --config ../smoke-rule.yml --json-output=symlink-smoke.json --verbose --metrics off .

                  scanned="$(jq -c '.paths.scanned' symlink-smoke.json)"
                  skipped="$(jq -c '.paths.skipped' symlink-smoke.json)"

                  for tracked_path in link.js vendored-dir; do
                      if jq -e --arg p "$tracked_path" 'index($p) != null' <<< "$scanned" > /dev/null; then
                          echo "::error::The pinned engine reported the git-tracked ${tracked_path} as scanned - assert_semgrep_report_complete()'s repo_root comparison assumes this object type never is: ${scanned}"
                          exit 1
                      fi
                      if jq -e --arg p "$tracked_path" 'any(.[]?; (.path // .) == $p)' <<< "$skipped" > /dev/null; then
                          echo "::error::The pinned engine reported the git-tracked ${tracked_path} as skipped - assert_semgrep_report_complete()'s repo_root comparison assumes this object type never is: ${skipped}"
                          exit 1
                      fi
                  done

                  echo "Pinned engine kept the tracked symlink and gitlink out of both paths.scanned and paths.skipped."

    shell-tests:
        name: Shell logic tests
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run shell-logic tests
              run: bash .github/scripts/tests/run-tests.sh
