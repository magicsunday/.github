name: i18n (reusable)

# Reusable translation-catalogue check for repositories that ship gettext
# locales. Two concerns, deliberately different severities:
#
#   1. Layout (HARD FAIL): every tracked .po/.mo must live at
#      <lang-dir>/<locale>/messages.{po,mo}. A catalogue committed anywhere
#      else — e.g. a stray top-level messages.po — fails the check, so a
#      contributor's misplaced file blocks the pull request until corrected.
#      The local pre-commit hook only runs for committers who opted in; this
#      check enforces the layout for every PR, including forks.
#
#   2. Fuzzy (ADVISORY, never fails): fuzzy PO entries are surfaced as
#      non-blocking annotations. They compile out to the English fallback,
#      which is acceptable, so they must not gate a merge — requiring a
#      contributor to translate every locale before merging would be hostile.
#      New languages and partial translations therefore pass freely.
#
#   3. Pipeline freshness (HARD FAIL, opt-in via `check-pipeline: true`): runs
#      the module's source-driven `make lang` and fails if it errors or leaves
#      a non-empty diff. This catches a stale catalogue (a source string added
#      or removed without re-running the pipeline) and a broken pipeline (such
#      as a bad msgmerge flag) before either ships green. Repositories whose
#      `make lang` is still compile-only leave `check-pipeline` at its default
#      (false) and the job is skipped.
#
#   4. Core overlap (HARD FAIL, on by default, off via `check-core-overlap: false`): fails
#      when a catalogue entry carries a non-empty translation for a text that
#      webtrees core already translates in that locale. webtrees merges a
#      module's compiled catalogue over its own, so such an entry replaces the
#      core text in the whole installation and goes stale when core rewords it.
#      An empty entry is fine. It is not compiled and core applies. The core
#      catalogues come from the webtrees release tags the module supports, read
#      from its composer constraint on fisharebest/webtrees, or from
#      `core-tags` when the constraint uses syntax the check does not resolve.
#      On a pull request the check runs only when the pull request changes a
#      file below `lang-dir` or the `composer.json` of the repository root,
#      because nothing else can create an overlap. Every other event runs it,
#      and so does a pull request whose changed files cannot be listed.
#
# The generated .pot template is gitignored and never appears in the tree, so
# it needs no special handling. Callers invoke this via
# `uses: magicsunday/.github/.github/workflows/i18n.yml@main` and may override
# `lang-dir` if their catalogues live outside `resources/lang`.
on:
    workflow_call:
        inputs:
            lang-dir:
                description: 'Root directory holding the per-locale catalogues.'
                type: string
                default: 'resources/lang'
            check-pipeline:
                description: 'Run `make lang` and fail on a non-empty diff (source-driven pipeline only).'
                type: boolean
                default: false
            check-core-overlap:
                description: 'Fail when a catalogue entry translates a text that webtrees core already translates.'
                type: boolean
                default: true
            core-tags:
                description: 'Space-separated webtrees release tags to compare with. Empty derives them from the composer constraint.'
                type: string
                default: ''
            node-image:
                description: 'Container image whose gettext/msgfmt must match the maintainer''s local `make lang`.'
                type: string
                default: 'node:24-alpine'

permissions:
    contents: read

jobs:
    i18n:
        name: Catalogue layout
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check catalogue layout and fuzzy entries
              env:
                  LANG_DIR: ${{ inputs.lang-dir }}
              run: |
                  set -euo pipefail

                  lang_dir="${LANG_DIR%/}"
                  allowed_re="^${lang_dir}/[^/]+/messages\.(po|mo)$"

                  # 1. Layout — collect every tracked catalogue not at the
                  # expected <lang_dir>/<locale>/messages.{po,mo} path.
                  misplaced=()
                  while IFS= read -r f; do
                      [ -n "$f" ] || continue
                      [[ "$f" =~ $allowed_re ]] || misplaced+=("$f")
                  done < <(git ls-files '*.po' '*.mo')

                  # 2. Fuzzy — count per PO, emit a non-blocking warning each.
                  fuzzy_total=0
                  fuzzy_lines=()
                  while IFS= read -r po; do
                      [ -n "$po" ] || continue
                      n=$(awk '/^#~/{next} /^#,.*fuzzy/{c++} END{print c+0}' "$po")
                      [ "$n" -gt 0 ] || continue
                      fuzzy_total=$((fuzzy_total + n))
                      fuzzy_lines+=("${po}: ${n}")
                      echo "::warning file=${po}::${n} fuzzy entries compile out to the English fallback (non-blocking; native-speaker update welcome)."
                  done < <(git ls-files "${lang_dir}/*.po")

                  {
                      echo "## i18n catalogue check"
                      echo
                      echo "Expected layout: \`${lang_dir}/<locale>/messages.{po,mo}\`"
                      echo
                      if [ ${#misplaced[@]} -eq 0 ]; then
                          echo "- **Layout:** ✔ all catalogues correctly placed"
                      else
                          echo "- **Layout:** ✘ ${#misplaced[@]} misplaced file(s):"
                          printf '  - `%s`\n' "${misplaced[@]}"
                      fi
                      echo "- **Fuzzy (advisory, non-blocking):** ${fuzzy_total} entries"
                      if [ ${#fuzzy_lines[@]} -gt 0 ]; then
                          printf '  - `%s`\n' "${fuzzy_lines[@]}"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ ${#misplaced[@]} -gt 0 ]; then
                      for f in "${misplaced[@]}"; do
                          echo "::error file=${f}::Translation catalogue must live at ${lang_dir}/<locale>/messages.{po,mo}."
                      done
                      echo "i18n layout check failed: ${#misplaced[@]} misplaced catalogue file(s)." >&2
                      exit 1
                  fi

                  echo "i18n layout check passed."

    pipeline:
        name: Pipeline freshness
        if: ${{ inputs.check-pipeline }}
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run `make lang` and assert the catalogue is up to date
              timeout-minutes: 15
              env:
                  NODE_IMAGE: ${{ inputs.node-image }}
              run: |
                  set -euo pipefail

                  # Drive the whole pipeline inside the same image the
                  # maintainer's `make lang` uses, so xgettext / msgmerge /
                  # msgfmt output is byte-identical to the committed
                  # catalogue (a host gettext of a different version would
                  # reflow PO lines and trip a phantom diff). COMPOSE_RUN is
                  # emptied so each recipe runs in this container instead of
                  # spawning a nested `docker compose` service; the
                  # fuzzy-resolver (python3) runs in the same container, so no
                  # host/container ownership split corrupts the PO files.
                  # `set -e` + visible apk stderr so a failed toolchain
                  # install aborts loudly instead of later in an opaque way.
                  docker run --rm -v "$PWD":/app -w /app "$NODE_IMAGE" sh -c '
                      set -e
                      apk add --no-cache make bash gettext python3 >/dev/null
                      make lang COMPOSE_RUN=
                  '

                  # Stage everything so the check also catches NEW untracked
                  # catalogue files (a freshly seeded locale, or a .mo for a
                  # .po that lacked one) — `git diff` alone ignores untracked
                  # files. Gitignored artefacts (the generated .pot) stay out.
                  git add -A
                  if git diff --cached --quiet; then
                      echo "i18n pipeline freshness check passed: \`make lang\` is a no-op." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  echo "::error::make lang produced changes — the committed catalogue is out of date or the pipeline is broken. Run make lang locally and commit the result."
                  {
                      echo "## i18n pipeline freshness"
                      echo
                      echo "Running \`make lang\` changed the tree. Either the catalogue is stale (a source string was added or removed without re-running the pipeline) or the pipeline itself drifted."
                      echo
                      echo '### Changes'
                      echo '```'
                      git diff --cached --stat
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  git --no-pager diff --cached
                  exit 1

    # A pull request can only create an overlap by changing a catalogue or by
    # changing the webtrees constraint that decides which core tags are
    # compared. This job reports whether the pull request touched one of the
    # two. Every other event, and any failure to read the change list, counts as
    # relevant so the check never goes missing by accident.
    core-overlap-scope:
        name: Core text overlap scope
        if: ${{ inputs.check-core-overlap }}
        runs-on: ubuntu-latest

        permissions:
            contents: read

        outputs:
            relevant: ${{ steps.scope.outputs.relevant }}

        steps:
            # The checkout of a pull request is the merge commit of the base
            # and the head. Two commits of history reach its first parent, the
            # base, so the diff of that parent against the merge commit lists
            # exactly the files the pull request changes.
            - name: Checkout
              if: ${{ github.event_name == 'pull_request' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 2
                  persist-credentials: false

            - name: Decide whether the check applies
              id: scope
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  LANG_DIR: ${{ inputs.lang-dir }}
              run: |
                  set -euo pipefail

                  if [ "${EVENT_NAME}" != "pull_request" ]; then
                      echo "relevant=true" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi

                  lang_dir="${LANG_DIR%/}"
                  if ! changed="$(git diff --name-only HEAD^1 HEAD)"; then
                      echo "::notice::Could not list the changed files, so the check runs."
                      echo "relevant=true" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi

                  relevant=false
                  while IFS= read -r changed_path; do
                      case "${changed_path}" in
                          "${lang_dir}"/* | composer.json) relevant=true ;;
                      esac
                  done <<< "${changed}"

                  echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"

    core-overlap:
        name: Core text overlap
        needs: core-overlap-scope
        if: ${{ inputs.check-core-overlap && needs.core-overlap-scope.outputs.relevant == 'true' }}
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            # The workspace holds the CALLER's checkout, so the check script
            # and its pinned requirements come from the commit of this workflow
            # itself. Both values are asserted first so an empty one never
            # falls back to the default branch. The path is claimed rather
            # than assumed free, because the final step deletes it.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }
                  { test ! -e .magicsunday-shared && test ! -L .magicsunday-shared; } || { echo "::error::This repository contains a path named '.magicsunday-shared', which the shared workflows reserve for their own checkout and delete again."; exit 1; }

            - name: Check out the check script
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  persist-credentials: false

            - name: Install polib
              run: |
                  set -euo pipefail
                  pip install --quiet --only-binary=:all: --require-hashes -r .magicsunday-shared/.github/requirements/polib.txt

            - name: Compare the catalogues with webtrees core
              timeout-minutes: 15
              env:
                  LANG_DIR: ${{ inputs.lang-dir }}
                  CORE_TAGS: ${{ inputs.core-tags }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob

                  lang_dir="${LANG_DIR%/}"
                  script=.magicsunday-shared/.github/scripts/lib/i18n_core_overlap.py
                  work="$(mktemp -d)"

                  git ls-remote --tags --refs https://github.com/fisharebest/webtrees.git \
                      | sed 's|.*refs/tags/||' > "$work/available-tags"

                  # Without an explicit list, the tags are the releases that the
                  # composer constraint on fisharebest/webtrees covers. The
                  # script reports an unusable constraint on stdout, so the
                  # captured text is printed before the job stops.
                  read -r -a tags <<< "${CORE_TAGS//$'\n'/ }"
                  if [ "${#tags[@]}" -eq 0 ]; then
                      derived="$(python3 "$script" tags --composer composer.json --tags-file "$work/available-tags")" || {
                          printf '%s\n' "$derived"
                          exit 1
                      }
                      mapfile -t tags <<< "$derived"
                  fi

                  # A tag that does not exist would answer 404 for every locale
                  # and read as an empty comparison, so each one is checked first.
                  for tag in "${tags[@]}"; do
                      grep -Fxq -- "$tag" "$work/available-tags" || { echo "::error::'$tag' is not a webtrees release tag."; exit 1; }
                  done

                  echo "Comparing with webtrees core releases: ${tags[*]}"

                  # The module locales are compared. The German catalogue is
                  # fetched as well and must exist, because core ships it for
                  # every release. Without it, a changed layout of the core
                  # repository would answer 404 for everything and read as a
                  # clean result, while a module that only has locales core
                  # does not ship passes.
                  locales=(de)
                  for locale_path in "$lang_dir"/*/messages.po; do
                      locale="$(basename "$(dirname "$locale_path")")"
                      [[ "$locale" =~ ^[A-Za-z0-9_@-]+$ ]] || { echo "::error::The catalogue directory name '${locale//[^A-Za-z0-9_@-]/?}' is not a locale tag."; exit 1; }
                      locales+=("$locale")
                  done

                  # A locale that core does not ship answers 404 and is
                  # skipped. Any other failure stops the job, so a network
                  # problem never reads as a clean result.
                  for locale in $(printf '%s\n' "${locales[@]}" | sort -u); do
                      for tag in "${tags[@]}"; do
                          target="$work/core/$tag/$locale/messages.po"
                          mkdir -p "$(dirname "$target")"
                          status="$(curl --silent --show-error --globoff --location --retry 3 --retry-all-errors \
                              --output "$target" --write-out '%{http_code}' \
                              "https://raw.githubusercontent.com/fisharebest/webtrees/$tag/resources/lang/$locale/messages.po")"
                          case "$status" in
                              200) ;;
                              404)
                                  [ "$locale" != de ] || { echo "::error::The core catalogue of de is missing at $tag, so the layout of the core repository changed."; exit 1; }
                                  rm -f "$target"
                                  ;;
                              *) echo "::error::Fetching the core catalogue of $locale at $tag returned HTTP $status."; exit 1 ;;
                          esac
                      done
                  done

                  mkdir -p "$work/core"
                  status=0
                  python3 "$script" check --lang-dir "$lang_dir" --core-root "$work/core" || status=$?
                  rm -rf .magicsunday-shared "$work"
                  exit "$status"
