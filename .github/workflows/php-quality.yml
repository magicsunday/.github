name: PHP quality (reusable)

# Reusable PHP quality gate for the magicsunday/* projects. Runs the canonical
# granular `composer ci:test:php:*` steps across a PHP matrix, each as its own
# step so a red build names the gate that broke. Callers invoke it via
# `uses: magicsunday/.github/.github/workflows/php-quality.yml@main`.
#
# The steps are deliberately granular rather than the `ci:test` aggregate: the
# aggregate is the local pre-commit hook, so a suite wired only into it would
# never run in CI — a green local run is not evidence of CI coverage.
#
# Copy-paste detection is deliberately NOT part of this workflow: jscpd is a Node
# tool, so it belongs with the calling repository's JS lane where Node is set up.
#
# Adopting this workflow RENAMES the reported status checks (a reusable reports
# as `<caller job> / <reusable job> (<matrix value>)`), so the calling
# repository's branch-protection required-checks list must be updated in the
# same change.
on:
    workflow_call:
        inputs:
            php-versions:
                description: 'JSON array of PHP versions for the build matrix.'
                required: false
                type: string
                default: '["8.3", "8.4", "8.5"]'
            run-psr4:
                description: 'Run the strict PSR-4 autoload check (composer ci:test:php:psr4).'
                required: false
                type: boolean
                default: false
            run-infection:
                description: 'Run mutation testing (composer ci:test:php:infection), on the infection-php leg only.'
                required: false
                type: boolean
                default: false
            infection-php:
                description: 'The single PHP version leg that runs mutation testing.'
                required: false
                type: string
                default: '8.4'

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                php: ${{ fromJSON(inputs.php-versions) }}

        steps:
            # Mutation testing needs a coverage driver; every other leg runs
            # without one so the matrix stays fast.
            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: ${{ (inputs.run-infection && matrix.php == inputs.infection-php) && 'pcov' || 'none' }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: composer-cache-vars
              name: Composer cache vars
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            # Keyed on the lockfile hash rather than a timestamp, so a rerun
            # with an unchanged lockfile hits the cache instead of always
            # falling through to `restore-keys` (the previous per-repo
            # implementations mixed a timestamp into the key, which
            # guaranteed a miss on every run).
            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache-vars.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-
                      ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Lint
              run: composer ci:test:php:lint

            - name: PSR-4 autoload
              if: ${{ inputs.run-psr4 }}
              run: composer ci:test:php:psr4

            - name: PHPStan
              run: composer ci:test:php:phpstan

            - name: Rector
              run: composer ci:test:php:rector

            - name: Coding guidelines
              run: composer ci:test:php:cgl

            - name: Unit tests
              run: composer ci:test:php:unit

            # Four optional consumer-side gates. Three of them adopt an asset the
            # coding-standard package ships — the template lockstep gate, the phpat
            # subject-liveness guard and the Deptrac architecture-layer check; the
            # fourth, a PHPStan pass over glue code, is configured per consumer. A
            # consumer opts in to each by defining the composer script under the exact
            # name probed below, so the steps stay green for consumers that have not
            # adopted them yet.
            #
            # Because each probe matches one exact name, a consumer whose script is
            # spelled differently is indistinguishable from one that never adopted the
            # gate: both skip green. The step therefore also logs every `ci:test:`
            # script the consumer declares, so the raw material for that diagnosis is
            # in the step log rather than having to be reconstructed from the repository.
            # The listing is not itself a detector — a `false` verdict standing beside a
            # similar-looking name is the normal case, since every consumer declares
            # near neighbours such as `ci:test:php:phpstan`. What keeps a divergent name
            # from reaching CI is the adoption contract: a consumer renames its script
            # to the probed name as part of migrating its PHP lane to this workflow.
            #
            # Both lines are plain log output. An annotation would attach to every green
            # run of every consumer for a gate most of them have not adopted.
            - name: Detect optional consumer gates
              id: gates
              run: |
                  has() {
                      if jq -e --arg k "$1" '.scripts[$k]' composer.json >/dev/null 2>&1; then
                          echo 'true'
                      else
                          echo 'false'
                      fi
                  }
                  templates=$(has ci:test:php:templates)
                  phpat_subjects=$(has ci:test:php:phpat-subjects)
                  deptrac=$(has ci:test:php:deptrac)
                  phpstan_glue=$(has ci:test:php:phpstan:glue)
                  # `ci:test:` rather than `ci:test:php:`, so a script that drops the
                  # `php:` segment still appears. The listing is best-effort by nature —
                  # a name drifting far enough falls outside any fixed prefix — and it
                  # is diagnostic only, so it must never fail the step: both terminators
                  # are flattened so no script name can break the line apart, and the
                  # fallback keeps it inert should a future `set -o pipefail` land here.
                  declared=$(jq -r '.scripts // {} | keys[] | select(startswith("ci:test:"))' composer.json 2>/dev/null | tr '\r\n' '  ') || declared=''
                  echo "Optional consumer gates probed: templates=${templates} phpat_subjects=${phpat_subjects} deptrac=${deptrac} phpstan_glue=${phpstan_glue}"
                  echo "composer.json declares: ${declared}"
                  {
                      echo "templates=${templates}"
                      echo "phpat_subjects=${phpat_subjects}"
                      echo "deptrac=${deptrac}"
                      echo "phpstan_glue=${phpstan_glue}"
                  } >> "$GITHUB_OUTPUT"

            # These gates are PHP-version-independent (they read config files and parse
            # source), so they run once on the first matrix leg only.
            - name: Template lockstep gate
              if: ${{ steps.gates.outputs.templates == 'true' && matrix.php == fromJSON(inputs.php-versions)[0] }}
              run: composer ci:test:php:templates

            - name: PHPat subject-liveness guard
              if: ${{ steps.gates.outputs.phpat_subjects == 'true' && matrix.php == fromJSON(inputs.php-versions)[0] }}
              run: composer ci:test:php:phpat-subjects

            - name: Deptrac architecture layers
              if: ${{ steps.gates.outputs.deptrac == 'true' && matrix.php == fromJSON(inputs.php-versions)[0] }}
              run: composer ci:test:php:deptrac

            # Procedural glue PHP — CLI scripts, the root module entry point, build
            # tooling — usually sits outside the paths the main PHPStan config
            # analyses, so it drifts from refactored service signatures unseen. A
            # consumer brings it under a dedicated config by defining this script.
            #
            # Unlike the three gates above, this one resolves language-level behaviour
            # per interpreter, so it runs on every matrix leg rather than only the
            # first. It sits behind them for exactly that reason: a step failing under
            # the default `if: success()` skips the rest, and since those three run on
            # the first leg alone, a red gate ahead of them would leave all three
            # without a verdict on any leg.
            #
            # That argument does not extend to the mutation step below, which is skipped
            # by a red gate here on its one leg. The order there is the deliberate
            # opposite: a cheap static gate belongs ahead of the expensive mutation run,
            # so a failure short-circuits it rather than paying for it first.
            - name: PHPStan (glue code)
              if: ${{ steps.gates.outputs.phpstan_glue == 'true' }}
              run: composer ci:test:php:phpstan:glue

            - name: Mutation testing
              if: ${{ inputs.run-infection && matrix.php == inputs.infection-php }}
              run: composer ci:test:php:infection
