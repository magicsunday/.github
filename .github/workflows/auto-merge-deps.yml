name: Auto-merge dependencies (reusable)

# Reusable Dependabot auto-merge shared across all magicsunday repositories.
# Enables auto-merge for safe (semver patch / minor) Dependabot pull requests;
# majors are left for a human. Nothing here approves a pull request, so a
# repository that requires a review still gets one. Auto-merge only completes
# once the repository's required status checks pass, so it gates on green CI
# when branch protection is configured. Callers invoke it on `pull_request` via
# `uses: magicsunday/.github/.github/workflows/auto-merge-deps.yml@main`.
on:
    workflow_call:

permissions: {}

jobs:
    auto-merge:
        name: Auto-merge Dependabot PRs
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event.pull_request.user.login == 'dependabot[bot]'

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # The metadata action reports the HIGHEST update type of a group, and
            # it counts every bump of a git-pinned dependency (`github:owner/repo#X.Y.Z`)
            # as a major one, because Dependabot gives such a pin's new version as
            # a commit hash. One git pin therefore keeps a whole group of minor and
            # patch bumps from merging. The classification below reads the tag of
            # the pin from the package.json patch instead. The workflow reads its
            # own scripts from a second checkout at its own revision, the same
            # way `code-scanning.yml` does. An empty `job.workflow_sha` would
            # make the checkout fall back to the default branch without a
            # message, so both values are asserted before the checkout.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }

            - name: Check out the shared scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  sparse-checkout: .github/scripts/lib
                  persist-credentials: false

            - name: Classify the update type
              id: classify
              env:
                  DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
                  GROUP_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
                  PULL_REQUEST_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  test -f .magicsunday-shared/.github/scripts/lib/auto-merge-update-type.sh || { echo "::error::The shared checkout does not contain the classification script."; exit 1; }
                  source .magicsunday-shared/.github/scripts/lib/auto-merge-update-type.sh
                  files="$(gh api --paginate --slurp "$PULL_REQUEST_FILES")"
                  patch="$(package_json_patches "$files")"
                  update_type="$(effective_update_type "${DEPENDENCIES_JSON:-[]}" "$patch" "$GROUP_UPDATE_TYPE")"
                  echo "Update type of the group: $update_type (reported by the metadata action: $GROUP_UPDATE_TYPE)"
                  echo "update-type=$update_type" >> "$GITHUB_OUTPUT"

            # Patch and minor bumps merge automatically; majors are left for a
            # human to review. The exception is the shared repository's own `pip`
            # manifests: `.github/requirements/*.txt` hold the tool versions the
            # shared gates run, so a bump changes gate behaviour in every
            # repository at once, while a green run there only proves the new
            # version against that repository's own files.
            #
            # The condition names the repository as well as the ecosystem —
            # inside a reusable workflow `github.repository` is the CALLER — so a
            # consumer's own Python dependency keeps merging normally. There it
            # is written as "is `github_actions`" rather than "is not `pip`", the
            # two ecosystems that repository declares: an ecosystem the metadata
            # step failed to determine then holds the pull request instead of
            # releasing it.
            #
            # These literals are Dependabot's BRANCH segments, which is what
            # `fetch-metadata` reports — `github_actions` and `npm_and_yarn`
            # carry underscores, unlike the hyphenated keys in `dependabot.yml`.
            - name: Enable auto-merge for patch / minor
              if: >-
                  (github.repository != 'magicsunday/.github' ||
                  steps.metadata.outputs.package-ecosystem == 'github_actions') &&
                  (steps.classify.outputs.update-type == 'version-update:semver-patch' ||
                  steps.classify.outputs.update-type == 'version-update:semver-minor')
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr merge --auto --squash "$PR_URL"
