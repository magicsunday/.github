name: Zizmor (reusable)

# Reusable zizmor audit of the calling repository's GitHub Actions workflows
# (template-injection, over-broad permissions, unpinned actions, …). Callers
# invoke it via `uses: magicsunday/.github/.github/workflows/zizmor.yml@main`
# and must grant `security-events: write`.
on:
    workflow_call:

permissions:
    contents: read

jobs:
    zizmor:
        name: Zizmor (workflow security)
        runs-on: ubuntu-latest

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Same shared-checkout preconditions code-scanning.yml already
            # applies before checking out its own canonical sources. Inlined
            # rather than sourced from a lib script like
            # canonical-file-guard.sh two steps below: this check exists to
            # validate that checking out .magicsunday-shared is safe, so it
            # cannot itself depend on a script fetched FROM that same
            # checkout - there is nothing to source it from yet.
            - name: Check the shared-checkout preconditions
              env:
                  WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
                  WORKFLOW_SHA: ${{ job.workflow_sha }}
              run: |
                  set -euo pipefail
                  test -n "$WORKFLOW_REPOSITORY" || { echo "::error::job.workflow_repository is empty."; exit 1; }
                  test -n "$WORKFLOW_SHA" || { echo "::error::job.workflow_sha is empty."; exit 1; }
                  { test ! -e .magicsunday-shared && test ! -L .magicsunday-shared; } || { echo "::error::This repository contains a path named '.magicsunday-shared', which the shared workflows reserve for their own checkout and delete again - rename it, or the check would silently skip it."; exit 1; }

            - name: Check out the canonical .github/zizmor.yml
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .magicsunday-shared
                  persist-credentials: false

            # A repository whose .github/zizmor.yml is missing or has
            # drifted from the canonical copy silently degrades to a
            # stricter zizmor default (issue #38) - see
            # canonical-file-guard.sh's own docblock for the anchored claim
            # about what that default is, rather than repeating it here as
            # a second copy that can go stale independently.
            # assert_canonical_zizmor_config() (canonical-file-guard.sh,
            # sourced below) carries the complete comparison, so
            # test-canonical-file-guard.sh exercises the exact check this
            # step relies on.
            - name: Verify .github/zizmor.yml matches the canonical copy
              run: |
                  set -euo pipefail
                  # shellcheck source=scripts/lib/canonical-file-guard.sh
                  source .magicsunday-shared/.github/scripts/lib/canonical-file-guard.sh
                  # Sourced directly from .magicsunday-shared rather than
                  # staged out to runner.temp first (unlike Install Semgrep
                  # in code-scanning.yml): nothing here runs after the
                  # rm -rf below, so there is no later step this checkout
                  # needs to survive past.
                  #
                  # The comparison runs BEFORE the cleanup below - the
                  # canonical copy this reads lives under .magicsunday-shared
                  # itself, so removing it first would make every run report
                  # the "own checkout is missing" failure regardless of
                  # whether the caller's file actually matches.
                  assert_canonical_zizmor_config "$(pwd)/.magicsunday-shared"
                  rm -rf .magicsunday-shared

            # The action runs zizmor over the repository's workflows and uploads
            # the SARIF results to the code-scanning dashboard.
            - name: Run zizmor
              uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
