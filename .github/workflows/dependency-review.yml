name: Dependency review (reusable)

# Reusable dependency-review gate. Runs on pull requests and flags newly
# introduced vulnerable dependencies before they merge — complementing
# the vulnerability alerts, which only fire after merge. Callers invoke it via
# `uses: magicsunday/.github/.github/workflows/dependency-review.yml@main`.
on:
    workflow_call:

permissions:
    contents: read

jobs:
    dependency-review:
        name: Dependency review
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Dependency review
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  comment-summary-in-pr: on-failure
                  fail-on-severity: high
